name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check sources and run offline tests
        run: |
          set -eu
          for script in script/*.sh scripts/*.sh; do bash -n "$script"; done
          plutil -lint Packaging/Info.plist
          swift test
          ./scripts/smoke.sh --fixture gallery
      - name: Build and verify the Apple Silicon development distribution
        run: ./scripts/release.sh local
      - name: Observe first launch and automatic CLI detection on the runner
        run: ./scripts/verify-first-launch.sh dist/local/*/"Agent Hub.app"
