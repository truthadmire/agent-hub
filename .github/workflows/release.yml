name: Publish notarized macOS release
on:
  push:
    tags: ['v[0-9]*']
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref_protected && !github.event.repository.fork
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version-matched tag on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
          test "$GITHUB_REF_NAME" = "v$(plutil -extract CFBundleShortVersionString raw Packaging/Info.plist)"
          test -s CHANGELOG.md
          swift test
          ./scripts/smoke.sh --fixture gallery
          ./scripts/release.sh local

  sign:
    needs: validate
    runs-on: macos-26
    environment: macos-release
    permissions:
      contents: read
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Sign, notarize and verify
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          DEVELOPER_ID_IDENTITY: ${{ vars.DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          secret_dir=$(mktemp -d "$RUNNER_TEMP/agenthub-signing.XXXXXX")
          export SIGNING_KEYCHAIN="$secret_dir/agenthub.keychain-db"
          export NOTARY_KEY_PATH="$secret_dir/key.p8"
          cleanup() {
            security delete-keychain "$SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
            rm -rf "$secret_dir"
          }
          trap cleanup EXIT
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$secret_dir/certificate.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 14400 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$secret_dir/certificate.p12" -k "$SIGNING_KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$SIGNING_KEYCHAIN" >/dev/null
          unset CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD NOTARY_KEY_BASE64 keychain_password
          export AGENT_HUB_REPOSITORY_URL="https://github.com/$GITHUB_REPOSITORY"
          ./scripts/release.sh release

      - name: Transfer only verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/release/*/*.dmg
            dist/release/*/SHA256SUMS.txt
            dist/release/*/RELEASE-NOTES.md
            dist/release/*/build.json
            dist/release/*/notarization-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: assets
      - name: Publish verified files for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t sums < <(find assets -name SHA256SUMS.txt)
          test "${#sums[@]}" -eq 1
          cd "$(dirname "${sums[0]}")"
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Agent Hub ${GITHUB_REF_NAME#v} · Apple Silicon" --notes-file RELEASE-NOTES.md \
            *.dmg SHA256SUMS.txt build.json notarization-app.json notarization-dmg.json RELEASE-NOTES.md
